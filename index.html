<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript Builder</title>
<meta name="description" content="Paste a YouTube link, get a clean readable transcript. Free, no sign-up.">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 680px;
    text-align: center;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .steps {
    color: #888;
    font-size: 0.95rem;
    margin: 0 0 36px;
  }
  form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  input[type="url"] {
    flex: 1;
    min-width: 240px;
    padding: 14px 16px;
    font-size: 1rem;
    color: #111;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
  }
  input[type="url"]:focus { border-color: #111; }
  button {
    padding: 14px 24px;
    font-size: 1rem;
    font-weight: 500;
    color: #fff;
    background: #111;
    border: 1px solid #111;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: wait; }
  button.secondary {
    color: #111;
    background: #fff;
    border: 1px solid #ccc;
  }
  #status {
    margin: 24px 0 0;
    color: #888;
    min-height: 1.5em;
    line-height: 1.6;
  }
  #status.error { color: #c0392b; }
  #status a { color: #111; }
  #result { display: none; margin-top: 32px; text-align: left; }
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .toolbar input {
    flex: 1;
    min-width: 160px;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: #111;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
  }
  .toolbar button { padding: 10px 18px; font-size: 0.95rem; }
  pre {
    border: 1px solid #e3e3e3;
    border-radius: 8px;
    padding: 24px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.7;
    font-family: inherit;
    font-size: 0.95rem;
    max-height: 55vh;
    overflow-y: auto;
    margin: 0;
  }
  footer {
    margin-top: 40px;
    color: #aaa;
    font-size: 0.8rem;
  }
  footer a { color: #888; }
</style>
</head>
<body>
<main>
  <h1>YouTube Transcript Builder</h1>
  <p class="steps">Paste a YouTube link &rarr; wait a few seconds &rarr; get the transcript</p>

  <form id="form">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required autofocus>
    <button id="go" type="submit">Get transcript</button>
  </form>

  <p id="status"></p>

  <section id="result">
    <div class="toolbar">
      <input id="filename" type="text" placeholder="transcript.txt">
      <button id="download" type="button">Download .txt</button>
      <button id="copy" type="button" class="secondary">Copy</button>
    </div>
    <pre id="transcript"></pre>
  </section>

  <footer>
    Free, no sign-up. Nothing is stored.
    <a href="https://github.com/madhavp08/youtube-transcript-builder" target="_blank" rel="noopener">Run it locally</a>
  </footer>
</main>

<script>
  const form = document.getElementById("form");
  const urlInput = document.getElementById("url");
  const goBtn = document.getElementById("go");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const transcriptEl = document.getElementById("transcript");
  const filenameInput = document.getElementById("filename");
  const downloadBtn = document.getElementById("download");
  const copyBtn = document.getElementById("copy");

  const GITHUB_URL = "https://github.com/madhavp08/youtube-transcript-builder";
  const ALTERNATIVE_URL = "https://youtubetotranscript.com/";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const url = urlInput.value.trim();
    if (!url) return;

    goBtn.disabled = true;
    result.style.display = "none";
    status.className = "";
    status.textContent = "Fetching transcript\u2026";

    try {
      const res = await fetch("/api/transcript?url=" + encodeURIComponent(url));
      const data = await res.json();

      if (!res.ok) {
        if (data.blocked) {
          status.className = "error";
          status.innerHTML =
            "YouTube is currently blocking this website's server (a known " +
            "limitation of free hosting, sorry!). You can " +
            '<a href="' + GITHUB_URL + '" target="_blank" rel="noopener">run this tool locally</a>' +
            " or try " +
            '<a href="' + ALTERNATIVE_URL + '" target="_blank" rel="noopener">youtubetotranscript.com</a>.';
          return;
        }
        throw new Error(data.error || "Something went wrong.");
      }

      transcriptEl.textContent = data.transcript;
      filenameInput.value = data.video_id + "-transcript.txt";
      result.style.display = "block";
      status.textContent = "";
    } catch (err) {
      status.className = "error";
      status.textContent = err.message;
    } finally {
      goBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener("click", () => {
    let name = filenameInput.value.trim() || "transcript.txt";
    if (!name.endsWith(".txt")) name += ".txt";

    const blob = new Blob([transcriptEl.textContent], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  copyBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(transcriptEl.textContent);
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
  });
</script>
</body>
</html>
