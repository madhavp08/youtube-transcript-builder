<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript Builder</title>
<meta name="description" content="Paste a YouTube link, get a clean readable transcript. Free, no sign-up.">
<style>
  :root {
    --bg: #0f1117;
    --card: #181b23;
    --text: #e8eaf0;
    --muted: #9aa0ae;
    --accent: #ff4545;
    --border: #2a2e3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 760px; }
  h1 { font-size: 1.7rem; margin: 0 0 6px; }
  h1 span { color: var(--accent); }
  p.tag { color: var(--muted); margin: 0 0 28px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="url"] {
    flex: 1;
    min-width: 240px;
    padding: 13px 16px;
    font-size: 1rem;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  input[type="url"]:focus { border-color: var(--accent); }
  button {
    padding: 13px 22px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: wait; }
  #status { margin: 18px 0 0; color: var(--muted); min-height: 1.4em; }
  #status.error { color: #ff7b7b; }
  #result { display: none; margin-top: 24px; }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .toolbar input {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  .toolbar button { padding: 10px 18px; font-size: 0.95rem; }
  .toolbar .secondary { background: var(--card); border: 1px solid var(--border); }
  pre {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.6;
    font-family: inherit;
    font-size: 0.97rem;
    max-height: 60vh;
    overflow-y: auto;
  }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>YouTube <span>Transcript</span> Builder</h1>
  <p class="tag">Paste a YouTube link, get a clean readable transcript. Free, no sign-up. Videos up to 10 hours.</p>

  <form id="form">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required autofocus>
    <button id="go" type="submit">Get transcript</button>
  </form>

  <p id="status"></p>

  <section id="result">
    <div class="toolbar">
      <input id="filename" type="text" placeholder="transcript.txt">
      <button id="download" type="button">Download .txt</button>
      <button id="copy" type="button" class="secondary">Copy</button>
    </div>
    <pre id="transcript"></pre>
  </section>

  <footer>Transcripts come from YouTube's own captions. Nothing is stored on the server.</footer>
</main>

<script>
  const form = document.getElementById("form");
  const urlInput = document.getElementById("url");
  const goBtn = document.getElementById("go");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const transcriptEl = document.getElementById("transcript");
  const filenameInput = document.getElementById("filename");
  const downloadBtn = document.getElementById("download");
  const copyBtn = document.getElementById("copy");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const url = urlInput.value.trim();
    if (!url) return;

    goBtn.disabled = true;
    result.style.display = "none";
    status.className = "";
    status.textContent = "Fetching transcript…";

    try {
      const res = await fetch("/api/transcript?url=" + encodeURIComponent(url));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      transcriptEl.textContent = data.transcript;
      filenameInput.value = data.video_id + "-transcript.txt";
      result.style.display = "block";
      status.textContent = "";
    } catch (err) {
      status.className = "error";
      status.textContent = err.message;
    } finally {
      goBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener("click", () => {
    let name = filenameInput.value.trim() || "transcript.txt";
    if (!name.endsWith(".txt")) name += ".txt";

    const blob = new Blob([transcriptEl.textContent], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  copyBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(transcriptEl.textContent);
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
  });
</script>
</body>
</html>
